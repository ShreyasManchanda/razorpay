[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warden"
version = "0.1.0"
description = "Detector for dishonest agent-to-agent authorization"
requires-python = ">=3.11"
dependencies = [
    "langchain-groq>=1.1",
    "langchain-openai>=1.6",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "pynacl>=1.5",
    "langgraph>=1.2",
    "langchain-google-genai>=4.0",
    "langchain-core>=1.6",
    "sentence-transformers>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "razorpay>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
